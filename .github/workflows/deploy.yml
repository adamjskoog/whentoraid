name: Deploy to GitHub Pages

# Publishes the static build to https://whentoraid.github.io/ once the checks and
# end-to-end and database tests pass, on every push to main. To redeploy without a push: Actions → Deploy to
# GitHub Pages → Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run db:start
      - run: npm run test:db
      - run: npm run test:integration
      - name: Verify hosted Supabase schema
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" || -n "$SUPABASE_KEY" ]]; then
            test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
            version=$(curl --fail --silent --show-error \
              -H "apikey: $SUPABASE_KEY" \
              -H "Accept: application/json" \
              "$SUPABASE_URL/rest/v1/rpc/app_schema_version")
            # The newest migration's timestamp; src/lib/schema-version.test.js keeps the function in step.
            expected=$(ls supabase/migrations/*.sql | sort | tail -n 1 | xargs basename | cut -d_ -f1)
            if [[ "$version" != "\"$expected\"" ]]; then
              echo "Hosted Supabase schema is $version, expected \"$expected\"; apply the latest migration before deploying."
              exit 1
            fi
          fi
      # Tests run on a browser-only build; the published build connects to Supabase when these
      # repository variables are set (Settings > Secrets and variables > Actions > Variables).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
