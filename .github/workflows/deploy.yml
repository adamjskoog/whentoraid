name: Deploy to GitHub Pages

# Publishes the static build once the checks and end-to-end tests pass. Manual for now (Actions →
# Deploy to GitHub Pages → Run workflow): Pages is not enabled while the repository is private on the
# free plan. To deploy on every push again, enable Pages (Settings → Pages → Source: "GitHub
# Actions") and add back:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Tests run on a browser-only build; the published build connects to Supabase when these
      # repository variables are set (Settings > Secrets and variables > Actions > Variables).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
